services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["public_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["public_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: ["public_minio_data:/data"]
    restart: unless-stopped

  demo-target:
    build: ./backend/demo_target
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: public-demo
      DATABASE_URL: postgresql+asyncpg://tracepilot:${POSTGRES_PASSWORD}@postgres:5432/tracepilot
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    environment:
      APP_ENV: public-demo
      DATABASE_URL: postgresql+asyncpg://tracepilot:${POSTGRES_PASSWORD}@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '[]'
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ARTIFACT_BUCKET: tracepilot-artifacts
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      DEMO_AUTH_USERNAME: ${DEMO_AUTH_USERNAME:?DEMO_AUTH_USERNAME is required}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:?DEMO_AUTH_PASSWORD is required}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?DEMO_SESSION_SECRET is required}
      DEMO_COOKIE_SECURE: ${DEMO_COOKIE_SECURE:-true}
      DEMO_COOKIE_SAMESITE: ${DEMO_COOKIE_SAMESITE:-lax}
      DEMO_COOKIE_DOMAIN: ${DEMO_COOKIE_DOMAIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MAX_CALLS_PER_RUN: ${AI_MAX_CALLS_PER_RUN:-0}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped

  outbox-publisher:
    build: ./backend
    command: ["python", "-m", "app.workers.outbox_publisher"]
    environment:
      APP_ENV: public-demo
      DATABASE_URL: postgresql+asyncpg://tracepilot:${POSTGRES_PASSWORD}@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  playwright-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: public-demo
      DATABASE_URL: postgresql+asyncpg://tracepilot:${POSTGRES_PASSWORD}@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ARTIFACT_BUCKET: tracepilot-artifacts
    init: true
    ipc: host
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      demo-target: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCK_API: "false"
    ports: ["${PUBLIC_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  public_postgres_data:
  public_redis_data:
  public_minio_data:
