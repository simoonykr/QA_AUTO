[project]
name = "tracepilot-api"
version = "0.1.0"
description = "TracePilot modular monolith API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "redis>=5,<7",
  "alembic>=1.14,<2",
  "playwright==1.62.0",
  "minio>=7.2,<8",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
