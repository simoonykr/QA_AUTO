services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: tracepilot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tracepilot
      MINIO_ROOT_PASSWORD: tracepilot-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  demo-target:
    build: ./backend/demo_target
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80 >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 10
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@postgres:5432/tracepilot
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://127.0.0.1:5173","http://127.0.0.1:5174"]'
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  outbox-publisher:
    build: ./backend
    command: ["python", "-m", "app.workers.outbox_publisher"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  playwright-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://tracepilot:tracepilot@postgres:5432/tracepilot
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: tracepilot
      MINIO_SECRET_KEY: tracepilot-local-only
      MINIO_ARTIFACT_BUCKET: tracepilot-artifacts
    init: true
    ipc: host
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
      demo-target: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  minio_data:
