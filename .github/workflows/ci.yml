name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tc-poc/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-tc-poc/backend/pyproject.toml
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run backend tests
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tc-poc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ai-tc-poc/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Type check and build
        run: pnpm build

  compose-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tc-poc
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate public demo Compose
        env:
          POSTGRES_PASSWORD: ciDatabasePassword123456
          MINIO_ROOT_USER: tracepilot
          MINIO_ROOT_PASSWORD: ciMinioPassword123456
          DEMO_AUTH_USERNAME: ci-demo
          DEMO_AUTH_PASSWORD: ci-demo-password
          DEMO_SESSION_SECRET: ci-session-secret-longer-than-thirty-two-characters
        run: docker compose -f compose.public-demo.yml config --quiet
      - name: Build public frontend image
        run: docker build -f Dockerfile.frontend .
